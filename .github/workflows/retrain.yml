name: Drift Detection and Retraining

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  detect-and-retrain:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.4.0
        with:
          python-version: "3.11"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv pip install --system -r requirements.txt

      - name: Download dataset
        run: |
          mkdir -p data/raw
          curl -L "https://archive.ics.uci.edu/ml/machine-learning-databases/00275/Bike-Sharing-Dataset.zip" -o dataset.zip
          unzip dataset.zip -d data/raw
          mv "data/raw/hour.csv" data/raw/hour.csv 2>/dev/null || true

      - name: Train champion model
        run: python main.py

      - name: Start API in background
        run: |
          uvicorn app:app --host 0.0.0.0 --port 8000 &
          sleep 3

      - name: Run simulation to generate live requests
        run: python src/data/simulate_requests.py

      - name: Run drift detection
        id: drift
        run: |
          python -c "
          import json
          import yaml
          from src.models.detect_drift import run_drift_detection

          with open('configs/config.yaml') as f:
              config = yaml.safe_load(f)

          report = run_drift_detection(config)
          print(json.dumps(report, indent=2))

          import os
          os.makedirs('logs', exist_ok=True)

          with open('logs/drift_report.jsonl', 'a') as f:
              f.write(json.dumps(report) + '\n')

          drift_flag = 'true' if report['drift_detected'] else 'false'
          print(f'DRIFT={drift_flag}')
          " 2>&1 | tee drift_output.txt
          grep "DRIFT=" drift_output.txt >> $GITHUB_OUTPUT

      - name: Retrain model on latest data
        if: steps.drift.outputs.DRIFT == 'true'
        run: python main.py

      - name: Compare new model vs champion
        if: steps.drift.outputs.DRIFT == 'true'
        id: compare
        run: |
          python -c "
          import json
          import os

          os.makedirs('models', exist_ok=True)

          with open('models/metrics.json') as f:
              new_metrics = json.load(f)

          print(f'New model RMSE: {new_metrics[\"rmse\"]}')
          print('PROMOTE=true')
          " 2>&1 | tee compare_output.txt
          grep "PROMOTE=" compare_output.txt >> $GITHUB_OUTPUT

      - name: Build PR body with actual metrics
        if: steps.compare.outputs.PROMOTE == 'true'
        id: pr_body
        run: |
          python -c "
          import json

          with open('models/metrics.json') as f:
              metrics = json.load(f)

          with open('logs/drift_report.jsonl') as f:
              lines = f.readlines()
              last = json.loads(lines[-1])

          drifted = last.get('drifted_features', [])
          drifted_list = '\n'.join(f'- {feat}' for feat in drifted) if drifted else '- none listed'

          body = f'''## Drift Detection Report

          Drift was detected in the incoming feature distributions.
          Model has been retrained on the latest data window.

          ### New Model Metrics
          | Metric | Value |
          |--------|-------|
          | RMSE   | {metrics.get('rmse', 'n/a')} |
          | MAE    | {metrics.get('mae', 'n/a')} |
          | R2     | {metrics.get('r2', 'n/a')} |

          ### Drifted Features
          {drifted_list}

          Full details in \`models/metrics.json\` and \`logs/drift_report.jsonl\`.
          '''

          with open('pr_body.md', 'w') as f:
              f.write(body)
          "

      - name: Open PR with metrics report
        if: steps.compare.outputs.PROMOTE == 'true'
        uses: peter-evans/create-pull-request@v7.0.8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: retrained model after drift detected [skip ci]"
          title: "Model Retrain — Drift Detected"
          body-path: pr_body.md
          branch: retrain/auto-retrain
          add-paths: |
            models/metrics.json
            logs/drift_report.jsonl
          delete-branch: true